# Supabase local development config. `supabase start` reads this.
# project_id is a local label; the linked cloud project is set by `supabase link`.
project_id = "pantry-planner"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Configure the Google provider in the Supabase dashboard for the linked project.
# For local testing, set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / _SECRET and enable below.
[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
